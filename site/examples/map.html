<!-- With a _config tab the map plots every tab it lists, coloured and iconed per tab. -->
<div data-cell2-map-wrapper data-cell2-id="https://docs.google.com/spreadsheets/d/1wlr72cfR-Z0MlFsB_MxgjGVcd2UOv6ffdFyhTLpIzlQ/edit">
  <div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem">
    <input data-cell2-map-search placeholder="Search places…" aria-label="Search">
    <select data-cell2-map-filter-tabs aria-label="Type"><option value="">All types</option></select>
    <select data-cell2-map-filter="City" aria-label="City"><option value="">All cities</option></select>
    <button data-cell2-map-locate>Near me</button>
    <button data-cell2-map-reset>Reset</button>
    <span><span data-cell2-count></span> places</span>
  </div>
  <div data-cell2-map data-cell2-map-tiles="light" style="height:480px;border-radius:8px"></div>

  <!-- Popup template, cloned per marker when it is first opened. -->
  <div data-cell2-map-card style="display:none">
    <strong data-cell2-field="Name"></strong>
    <div><span data-cell2-field="City"></span> · <span data-cell2-meta="tab-label"></span></div>
    <p data-cell2-field="Description"></p>
    <a data-cell2-field-wrapper data-cell2-field-attr="href:Website" target="_blank" rel="noopener">Website</a>
  </div>
  <p data-cell2-empty style="display:none">No places match.</p>
</div>
