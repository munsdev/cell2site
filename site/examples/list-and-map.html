<!-- data-cell2-map-ref on the list names data-cell2-map-id on the map: clicking a card
     flies to the marker with the same Name and opens its popup. -->
<style>
  .lm { display: grid; grid-template-columns: 1fr 1.4fr; gap: 1rem; }
  .lm-card { border: 2px solid currentColor; border-radius: 8px; padding: .75rem 1rem; margin-bottom: .5rem; cursor: pointer; }
  @media (max-width: 700px) { .lm { grid-template-columns: 1fr; } }
</style>
<div class="lm">
  <div data-cell2-list data-cell2-id="https://docs.google.com/spreadsheets/d/1wlr72cfR-Z0MlFsB_MxgjGVcd2UOv6ffdFyhTLpIzlQ/edit" data-cell2-sheet="Museums" data-cell2-map-ref="museums"
       tabindex="0" role="region" aria-label="Museums"
       style="max-height:480px;overflow:auto">
    <article class="lm-card" data-cell2-item>
      <b data-cell2-field="Name"></b><br><small data-cell2-field="City"></small>
    </article>
  </div>
  <div data-cell2-map-wrapper data-cell2-id="https://docs.google.com/spreadsheets/d/1wlr72cfR-Z0MlFsB_MxgjGVcd2UOv6ffdFyhTLpIzlQ/edit" data-cell2-sheet="Museums" data-cell2-map-id="museums">
    <div data-cell2-map data-cell2-map-tiles="light" style="height:480px;border-radius:8px"></div>
    <div data-cell2-map-card style="display:none">
      <strong data-cell2-field="Name"></strong>
      <p data-cell2-field="Description"></p>
    </div>
  </div>
</div>
