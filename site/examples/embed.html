<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cell2site example: drop-in embeds</title>
  <link rel="stylesheet" href="example.css">
</head>
<body>
  <p class="back"><a href="/">cell2site</a> / examples / drop-in embeds · <a href="https://docs.google.com/spreadsheets/d/1wlr72cfR-Z0MlFsB_MxgjGVcd2UOv6ffdFyhTLpIzlQ/edit">open the sheet</a></p>
  <!-- Uses the public demo sheet. To use yours, replace the data-cell2-id value with your sheet's
       address-bar URL (shared as "Anyone with the link") and match the column names. -->

  <!-- No markup needed: each div builds itself. Columns are guessed by name (Name, Description,
       Website, Latitude, Longitude…); every other column is shown as a labelled line. -->

  <h2>Cards</h2>
  <div data-cell2-embed="cards" data-cell2-id="1wlr72cfR-Z0MlFsB_MxgjGVcd2UOv6ffdFyhTLpIzlQ" data-cell2-sheet="Museums"></div>

  <h2>List</h2>
  <div data-cell2-embed="list" data-cell2-id="1wlr72cfR-Z0MlFsB_MxgjGVcd2UOv6ffdFyhTLpIzlQ" data-cell2-sheet="Libraries"></div>

  <h2>Table, sorted by date</h2>
  <div data-cell2-embed="table" data-cell2-id="1wlr72cfR-Z0MlFsB_MxgjGVcd2UOv6ffdFyhTLpIzlQ" data-cell2-sheet="Events"
       data-cell2-sort-col="Date" data-cell2-sort-type="date"></div>

  <h2>Map</h2>
  <div data-cell2-embed="map" data-cell2-id="1wlr72cfR-Z0MlFsB_MxgjGVcd2UOv6ffdFyhTLpIzlQ" data-cell2-sheet="Parks"
       data-cell2-map-tiles="light" style="--c2-map-height:380px"></div>

  <script src="../cell2site.js"></script>
</body>
</html>
