<!-- Your own markup. data-cell2-wrapper lets search, filters and states sit outside the list. -->
<style>
  .lib-toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
  .lib-card { border: 2px solid currentColor; border-radius: 8px; padding: 1rem; margin-bottom: .75rem; }
  .lib-card h4 { margin: 0 0 .25rem; font-size: 1.15rem; }
  .lib-card p { margin: 0; opacity: .8; }
</style>
<div data-cell2-wrapper>
  <div class="lib-toolbar">
    <input data-cell2-search data-cell2-search-cols="Name, Description" placeholder="Search…" aria-label="Search">
    <select data-cell2-filter="City" aria-label="City"><option value="">All cities</option></select>
    <button data-cell2-reset>Reset</button>
    <span><span data-cell2-count></span> libraries</span>
  </div>
  <p data-cell2-empty style="display:none">Nothing matches.</p>
  <p data-cell2-error style="display:none">Could not load: <span data-cell2-field="message"></span></p>

  <div data-cell2-list data-cell2-id="https://docs.google.com/spreadsheets/d/1wlr72cfR-Z0MlFsB_MxgjGVcd2UOv6ffdFyhTLpIzlQ/edit" data-cell2-sheet="Libraries" data-cell2-sort-col="Name">
    <!-- The template: cloned once per row, then removed. -->
    <article class="lib-card" data-cell2-item>
      <h4 data-cell2-field="Name"></h4>
      <p data-cell2-field="Description"></p>
      <small data-cell2-field="City"></small>
      <!-- Removed when Website is blank, so there is never an empty link. -->
      <small data-cell2-field-wrapper> · <a data-cell2-field-attr="href:Website" target="_blank" rel="noopener">Website</a></small>
    </article>
  </div>
</div>
