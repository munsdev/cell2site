<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cell2site: list and map</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .layout { display: grid; grid-template-columns: 1fr 2fr; gap: 1rem; }
    .row { padding: .6rem; border-bottom: 1px solid #eee; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- Clicking a list row flies the map to the marker whose Name matches the row's Name,
       so Names must be unique. The two elements can sit anywhere on the page, and either may load first. -->

  <div class="layout">
    <div data-cell2-list data-cell2-id="YOUR_SHEET_URL" data-cell2-map-ref="places"
         data-cell2-sort-col="Name">
      <div class="row" data-cell2-item>
        <strong data-cell2-field="Name"></strong><br>
        <span data-cell2-field="Address"></span>
      </div>
    </div>

    <div data-cell2-map-wrapper data-cell2-id="YOUR_SHEET_URL" data-cell2-map-id="places">
      <div data-cell2-map style="height:480px"></div>
      <div data-cell2-map-card style="display:none">
        <strong data-cell2-field="Name"></strong>
        <p data-cell2-field="Address"></p>
      </div>
    </div>
  </div>

  <script src="../cell2site.js"></script>
</body>
</html>
