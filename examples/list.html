<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cell2site: custom list</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: .75rem; }
    .card img { max-width: 100%; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- Sheet columns used: Title, Description, Category, Date, Image, URL, Featured.
       Column names are case-sensitive. -->

  <!-- data-cell2-wrapper lets search, filter, count and the states sit outside the list element. -->
  <div data-cell2-wrapper>
    <input data-cell2-search data-cell2-search-cols="Title, Description" placeholder="Search…">
    <select data-cell2-filter="Category"><option value="">All categories</option></select>
    <button data-cell2-reset>Reset</button>
    <p><span data-cell2-count></span> results</p>

    <p data-cell2-loading style="display:none">Loading…</p>
    <p data-cell2-empty style="display:none">Nothing matches.</p>
    <p data-cell2-error style="display:none">Could not load: <span data-cell2-field="message"></span></p>

    <!-- Sorted newest first, first 20 after filtering. Blank dates sort last. -->
    <div data-cell2-list data-cell2-id="YOUR_SHEET_URL" data-cell2-sheet="Sheet1"
         data-cell2-sort-col="Date" data-cell2-sort-dir="desc" data-cell2-sort-type="date"
         data-cell2-item-limit="20">

      <!-- The template: cloned per row, then removed. -->
      <article class="card" data-cell2-item>
        <h3 data-cell2-field="Title"></h3>
        <!-- Cells with HTML are sanitised; plain URLs and [label](url) become links. -->
        <div data-cell2-field="Description"></div>
        <!-- The wrapper is removed when Image is blank. -->
        <div data-cell2-field-wrapper><img alt="" data-cell2-field-attr="src:Image"></div>
        <a data-cell2-field-attr="href:URL">Read more</a>
        <strong data-cell2-show-if="Featured">Featured</strong>
      </article>
    </div>
  </div>

  <script src="../cell2site.js"></script>
</body>
</html>
