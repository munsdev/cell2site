<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cell2site: tabs</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .menu { display: flex; gap: .5rem; border-bottom: 1px solid #ddd; }
    .menu a { padding: .5rem 1rem; cursor: pointer; }
    .menu a.w--current { border-bottom: 2px solid #1a56db; font-weight: 600; }
    .item { padding: .75rem 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

  <!-- Needs a tab named _config (not the first tab in the workbook) with one row per tab:
         Tab | Label     | Description        | Sort By | Sort Dir | Active
         Fri | Friday    | Opening day        | Time    | asc      | TRUE
         Sat | Saturday  | Main stage         | Time    | asc      |
       "Tab" is the sheet tab's name; a comma-separated Tab ("Fri, Sat") merges tabs.
       Without _config, list the tabs yourself: data-cell2-sheets="Fri, Sat". -->

  <div data-cell2-tabs data-cell2-id="YOUR_SHEET_URL">
    <div class="menu">
      <a data-cell2-tab-link>
        <span data-cell2-meta="tab-title"></span> (<span data-cell2-tab-count></span>)
      </a>
    </div>

    <div data-cell2-tab-content>
      <p data-cell2-meta="tab-description"></p>
      <div data-cell2-list>
        <div class="item" data-cell2-item>
          <strong data-cell2-field="Time"></strong> <span data-cell2-field="Title"></span>
        </div>
        <p data-cell2-empty style="display:none">Nothing scheduled.</p>
      </div>
    </div>

    <p data-cell2-error style="display:none"><span data-cell2-field="message"></span></p>
  </div>

  <script src="../cell2site.js"></script>
</body>
</html>
