<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cell2site: embeds</title>
</head>
<body style="font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem">

  <!-- Replace YOUR_SHEET_URL with the address-bar URL of a sheet shared as "Anyone with the link".
       Columns are guessed by name: Title/Name, Description, Image, URL/Link, Latitude, Longitude.
       Every other column becomes a labelled line. -->

  <h2>List</h2>
  <div data-cell2-embed="list" data-cell2-id="YOUR_SHEET_URL"></div>

  <h2>Cards, sorted, first 6</h2>
  <div data-cell2-embed="cards" data-cell2-id="YOUR_SHEET_URL"
       data-cell2-sort-col="Title" data-cell2-item-limit="6"></div>

  <h2>Table, with another tab and no search box</h2>
  <div data-cell2-embed="table" data-cell2-id="YOUR_SHEET_URL"
       data-cell2-sheet="Sheet2" data-cell2-embed-search="false"></div>

  <h2>Map (needs Latitude and Longitude columns)</h2>
  <!-- Theme with CSS variables: --c2-accent, --c2-radius, --c2-gap, --c2-line, --c2-soft, --c2-map-height -->
  <div data-cell2-embed="map" data-cell2-id="YOUR_SHEET_URL" style="--c2-map-height:360px"></div>

  <script src="../cell2site.js"></script>
</body>
</html>
