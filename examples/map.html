<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cell2site: map</title>
  <style>body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }</style>
</head>
<body>

  <!-- Needs Latitude and Longitude columns (decimals; "48,137" is accepted too). Optional: Name, Category,
       Color (e.g. #e11d48) and Icon (an emoji) for per-row markers. Leaflet loads itself. -->

  <div data-cell2-map-wrapper data-cell2-id="YOUR_SHEET_URL" data-cell2-sheet="Sheet1" data-cell2-col-name="Name">

    <input data-cell2-map-search data-cell2-map-search-cols="Name, Category" placeholder="Search…">
    <select data-cell2-map-filter="Category"><option value="">All categories</option></select>
    <button data-cell2-map-locate>Near me</button>
    <button data-cell2-map-reset>Reset</button>
    <span data-cell2-count></span> places

    <!-- The map needs a height. Tiles: osm, carto-light, carto-dark, esri-street, esri-topo. -->
    <div data-cell2-map style="height:480px" data-cell2-map-tiles="carto-light"
         data-cell2-map-center="48.1,11.6" data-cell2-map-zoom="5"></div>

    <!-- Popup template. Without one, the popup shows only the name. -->
    <div data-cell2-map-card style="display:none">
      <strong data-cell2-field="Name"></strong>
      <p data-cell2-field="Description"></p>
      <a data-cell2-field-attr="href:URL" target="_blank" rel="noopener">More info</a>
    </div>

    <p data-cell2-empty style="display:none">No places found.</p>
    <p data-cell2-error style="display:none"><span data-cell2-field="message"></span></p>
  </div>

  <script src="../cell2site.js"></script>
</body>
</html>
